[project]
name = "healthcare-research-assistant"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "deepeval>=4.1.9",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "langchain>=0.3.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langsmith>=0.1.0",
    "logfire[fastapi,requests]>=4.40.0",
    "loguru>=0.7.3",
    "nemoguardrails>=0.23.0",
    "nest-asyncio>=1.6.0",
    "numpy>=2.4.6",
    "openai>=1.70.0,<3.0.0",  # ragas' instructor dependency caps openai at <3.0.0
    "pandas>=2.3.3",
    "portkey-ai>=2.3.4",
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.2.3",
    "pytz>=2026.3.post1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "ragas>=0.4.3",
    "requests>=2.34.2",
    "sentence-transformers>=5.7.0",
    "slowapi>=0.1.9",
    "streamlit>=1.61.1",
    "tavily-python>=0.8.0",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
